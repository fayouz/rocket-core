# Reusable workflow: the Docker images of a Rocket brick (target "prod" of each component's Dockerfile).
# Built on every run (pull requests included, to catch Dockerfile breakage before merging); published to
# ghcr.io/<owner>/<repository>-<component> only for the long-lived gitflow branches and version tags.
# When not published, the images are loaded locally as <image-prefix>-<component>:ci and smoke-tested:
# - api: "bin/console about", the OpenAPI document lists api-resource, which answers 401 without a token;
# - front: /login answers with "Content-Security-Policy: frame-ancestors 'none'";
# - then the brick's own smoke-script, if any.
#
# The caller must grant the permissions: "contents: read" and "packages: write".
name: Brick images

on:
  workflow_call:
    inputs:
      image-prefix:
        description: Prefix of the local image names (<prefix>-<component>:ci); defaults to the repository name.
        type: string
        default: ''
      components:
        description: JSON list of {component, context} (component name and Docker build context).
        type: string
        default: '[{"component": "api", "context": "backend"}, {"component": "front", "context": "frontend"}]'
      api-resource:
        description: Path of an API resource that must be documented and protected (e.g. /api/users).
        type: string
        default: /api/users
      smoke-script:
        description: >-
          Optional script of the brick (path from the repository root), run after the common smoke test of each
          component with the component as argument and IMAGE (local image), API (http://localhost:8080, when the
          api container runs) and FRONT (http://localhost:3000, when the front container runs) in the environment.
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')) }}
      IMAGE: ${{ format('{0}-{1}:ci', inputs.image-prefix || github.event.repository.name, matrix.component) }}
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.components) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed by git describe (version of the build).
          fetch-depth: 0
      - id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: prod
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' }}
          tags: ${{ env.PUBLISH == 'true' && steps.meta.outputs.tags || env.IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Smoke test (api)
        if: env.PUBLISH != 'true' && matrix.component == 'api'
        env:
          API_RESOURCE: ${{ inputs.api-resource }}
        run: |
          docker run --rm -e APP_SECRET=ci -e JWT_PASSPHRASE=ci "$IMAGE" php bin/console about
          docker run -d --name api -p 8080:80 -e APP_SECRET=ci -e JWT_PASSPHRASE=ci "$IMAGE"
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/docs.jsonopenapi -o /dev/null && break; sleep 2; done
          # The OpenAPI document is JSON: "/" is escaped as "\/".
          curl -fsS http://localhost:8080/api/docs.jsonopenapi | grep -qF "${API_RESOURCE//\//\\/}"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$API_RESOURCE")" = 401
      - name: Smoke test (front)
        if: env.PUBLISH != 'true' && matrix.component == 'front'
        run: |
          docker run -d --name front -p 3000:3000 "$IMAGE"
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/login -o /dev/null && break; sleep 1; done
          curl -fsSI http://localhost:3000/login | grep -i "content-security-policy: frame-ancestors 'none'"
      - name: Smoke test (brick script)
        if: env.PUBLISH != 'true' && inputs.smoke-script != ''
        env:
          SMOKE_SCRIPT: ${{ inputs.smoke-script }}
          COMPONENT: ${{ matrix.component }}
          API: http://localhost:8080
          FRONT: http://localhost:3000
        run: bash -e "$SMOKE_SCRIPT" "$COMPONENT"

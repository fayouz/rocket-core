name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**', 'claude/**']
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    name: Symfony bundle
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: rocket_core_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, ldap, zip, sodium
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: php tests/App/bin/console lexik:jwt:generate-keypair --skip-if-exists
      - run: php tests/App/bin/console lint:container
      - run: php tests/App/bin/console doctrine:migrations:migrate --no-interaction
      - run: php tests/App/bin/console doctrine:schema:validate
      - run: vendor/bin/phpunit

  layer:
    name: Nuxt layer
    # The reusable workflow of the bricks' Nuxt applications, from this commit (also tests it).
    uses: ./.github/workflows/brick-frontend.yml
    with:
      working-directory: nuxt
      build-script: ''
